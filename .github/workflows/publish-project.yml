      - name: Push Docker image
        if: inputs.push_image && steps.exists.outputs.digest == ''
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image_meta.outputs.image_tag }}
        run: |
          set -euo pipefail
          if docker push "${REGISTRY_IMAGE_BASE}:${IMAGE_TAG}"; then
            exit 0
          fi
          # Com o repositório imutável, o push falha se a tag já foi publicada (ex.: re-run).
          # É o mesmo commit, então reusa a imagem que já está lá.
          existing=$(docker buildx imagetools inspect "${REGISTRY_IMAGE_BASE}:${IMAGE_TAG}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          if [[ -n "${existing}" ]]; then
            echo "::warning::${IMAGE_TAG} foi publicada por outra execução (${existing}). Reusando."
            exit 0
          fi
          exit 1

      - name: Digest final
        id: digest
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image_meta.outputs.image_tag }}
          EXISTING_DIGEST: ${{ steps.exists.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${EXISTING_DIGEST}"
          if [[ -z "${digest}" ]]; then
            digest=$(docker buildx imagetools inspect "${REGISTRY_IMAGE_BASE}:${IMAGE_TAG}" --format '{{.Manifest.Digest}}')
          fi
          if [[ -z "${digest}" ]]; then
            echo "::error::Não foi possível obter o digest de ${REGISTRY_IMAGE_BASE}:${IMAGE_TAG}"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Digest: ${digest}"