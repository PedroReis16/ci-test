name: Deploy project image

on:
  workflow_call:
    inputs:
      dockerfile_path:
        type: string
        required: true
      image_name:
        description: Nome do repositório no Docker Hub (ex. ci-test), sem o usuário. O path completo é DOCKERHUB_USERNAME/image_name.
        type: string
        required: true
      image_tag:
        description: Tag do ambiente a publicar (ex. dev-abc1234 ou hml-abc1234). É a única tag criada no build.
        type: string
        required: true
      push_image:
        type: boolean
        required: false
        default: true
    outputs:
      digest:
        description: Image digest in the registry
        value: ${{ jobs.publish-docker-image.outputs.digest }}
      short_sha:
        description: 7-character commit SHA used in image tags
        value: ${{ jobs.publish-docker-image.outputs.short_sha }}
      image_tag:
        description: Tag published or reused for this environment
        value: ${{ jobs.publish-docker-image.outputs.image_tag }}

jobs:
  publish-docker-image:
    name: Build and publish image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      short_sha: ${{ steps.image_meta.outputs.short_sha }}
      image_tag: ${{ steps.image_meta.outputs.image_tag }}
    env:
      DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
      # Monta aqui (secret + input), nunca via job output — o Actions descarta outputs que contêm secrets.
      REGISTRY_IMAGE_BASE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve image tags
        id: image_meta
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="${{ inputs.image_tag }}"

          if [[ -z "${REGISTRY_IMAGE_BASE}" || "${REGISTRY_IMAGE_BASE}" == /* || "${REGISTRY_IMAGE_BASE}" == */ ]]; then
            echo "::error::REGISTRY_IMAGE_BASE inválido: '${REGISTRY_IMAGE_BASE}'. Verifique DOCKERHUB_USERNAME e image_name."
            exit 1
          fi

          {
            echo "short_sha=${SHORT_SHA}"
            echo "image_tag=${IMAGE_TAG}"
            echo "registry_image=${REGISTRY_IMAGE_BASE}:${IMAGE_TAG}"
          } >> "$GITHUB_OUTPUT"

          echo "Build configuration: Release"
          echo "Image: ${REGISTRY_IMAGE_BASE}:${IMAGE_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login on Docker Hub
        if: inputs.push_image
        shell: bash
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            --username "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      # O prepare já decidiu que este conteúdo não tem imagem. Esta checagem só cobre
      # um re-run do mesmo commit que já tenha publicado a tag.
      - name: Tag já existe?
        id: exists
        if: inputs.push_image
        env:
          IMAGE_TAG: ${{ steps.image_meta.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "${REGISTRY_IMAGE_BASE}:${IMAGE_TAG}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          if [[ -n "${digest}" ]]; then
            echo "Imagem ${IMAGE_TAG} já existe (${digest}). Build será pulado."
          fi

      - name: Set up QEMU
        if: steps.exists.outputs.digest == ''
        uses: docker/setup-qemu-action@v3

      - name: Build image locally for security validation
        id: build
        if: steps.exists.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          load: true
          platforms: linux/amd64
          build-args: |
            BUILD_CONFIGURATION=Release
          tags: |
            ${{ env.REGISTRY_IMAGE_BASE }}:${{ steps.image_meta.outputs.image_tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          sbom: false

